version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # nixpkgs moves daily, so weekly bumps produced a PR every week.
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
